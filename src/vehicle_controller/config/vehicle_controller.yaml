controller_manager:
  ros__parameters:
    update_rate: 200
    vehicle_controller:
      type: vehicle_controller/VehicleController

vehicle_controller:
  ros__parameters:
    brake_joints: [RearRightDriver_Joint]
    wheel_joints: [RearRightWheel_Joint]
    # Axis 4 target is current feedback plus an offset in ODrive turns.
    position_max_offset_turns: 30.0
    # Axis 5 limit: +/-5 turns/s, expressed here in ROS rad/s.
    max_wheel_velocity_rad_s: 31.4159265359
    command_timeout_ms: 250
    # Bench test: motion_cmd alone drives the axes.  Production should set true.
    require_function_command: false
